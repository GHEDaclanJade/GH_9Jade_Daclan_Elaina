<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <title>Tables and Images with Bootstrap</title>
</head>
<body>
    <h2 class="text-center">Naruto Characters - Team 7</h2>
    <div class="row">
    <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTfn436uYudB2Nvu3pJbY753H7GU0fgAEW4Zz93akyeg4YUAk-L8oYzJlQ&s=10" alt="Uchiha Sasuke" height="300px" width="455px" class="rounded mx-auto d-block col-lg-4">
    <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTH4CdJdUIg6vd9JhzrBJGXdQzOjPkkomNIDiYkoH5GnRy9JZJ5cuk_xgqo&s=10" alt="Uchiha Sakura" height="300px" width="455px" class="rounded-circle mx-auto d-block col-lg-4">
    <img src="https://static0.srcdn.com/wordpress/wp-content/uploads/2026/02/naruto-uses-the-rasengan-against-sasuke.jpg?w=1600&h=900&fit=crop" alt="Uzumaki Naruto" height="200px" width="455px" class="img-thumbnail mx-auto d-block col-lg-4">
    </div>
    <h1 class="text-center">Bootstrap Table</h1>
    <img class="mx-auto d-block rounded" src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQoYvx2II7eBHU0hC-QVDYYVoAzOIGstj7V0kHlv60upQkGp1hSZXNmnQQo&s=10" alt="Spiderman" height="300px" width="500px">
    <table class="table table-bordered table-hover table-dark container">
        <tr>
            <th class="bg-danger" scope="col">Name</th>
            <th class="bg-warning" scope="col">Favorite Anime</th>
            <th class="bg-success" scope="col">Protagonist</th>
        </tr>
        <tr>
            <td>Elaina Daclan</td>
            <td>Chainsaw Man</td>
            <td><img src="https://www.themarysue.com/wp-content/uploads/2024/06/yoru-chainsaw-man.jpg" height="90px" width="150px"></td>
        </tr>
        <tr>
            <td>Zeeshan Dalidig</td>
            <td>Cocomelon</td>
            <td><img src="https://www.parents.com/thmb/65H4FzjZoopGTXkviMcczfmGNcY=/1500x0/filters:no_upscale():max_bytes(150000):strip_icc()/Parents-Cocomelon-JJ-33b717ae17df420dbddec9b12c7ecd08.jpg" height="150px" width="150px"></td>
        </tr>
        
        <tr>
            <td>Salve Ala</td>
            <td>Jujutsu Kaisen</td>
            <td><img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcR_XXlGK13FzOPeLyu7RKl4euHWVZ4xb0mAIWZNus3SmQ&s=10" height="100px" width="150px"></td>
        </tr>

        <tr>
            <td>Shara Ornedo</td>
            <td>One Piece</td>
            <td><img src="https://sketchok.com/images/articles/06-anime/002-one-piece/34/19m.jpg" height="150px" width="150px"></td>
        </tr>
    </table>
</body>
</html>
